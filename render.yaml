services:
  - type: web
    name: stockpilot-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false        # paste your Atlas connection string in the Render dashboard
      - key: CLIENT_URL
        sync: false        # your deployed web app URL
